<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Patchy app icon, full bleed, folded paper</title>
  <defs>
    <linearGradient id="armFold" gradientUnits="userSpaceOnUse" x1="0" y1="256" x2="0" y2="292">
      <stop offset="0" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="armOnTile" gradientUnits="userSpaceOnUse" x1="0" y1="256" x2="0" y2="274">
      <stop offset="0" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stemSeam" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="318" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="patchShadow" gradientUnits="userSpaceOnUse" x1="640" y1="368" x2="606" y2="402">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
