# See packaging/linux/README.md.
app-id: com.rtsoft.patchy
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: patchy
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Update check.
  - --share=network
  # Recent files, command-line file arguments, brush and palette folders.
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
modules:
  - name: patchy
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPATCHY_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../../..
        skip:
          - build
          - .deps
          - .git
          - local-secrets
          - local-test-fixtures
          - test-artifacts
